<style>
:root{
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 20px; --radius-sm: 12px;
  --ease: cubic-bezier(.22,1,.36,1);
  --sidebar: 264px;
}
html[data-theme="dark"]{
  --bg:#070a13; --bg2:#0b1020;
  --card: rgba(255,255,255,.035); --card-solid:#0f1526; --card-hover: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.075); --border-strong: rgba(255,255,255,.14);
  --text:#eef1f8; --text2:#b4bccd; --muted:#8a94a8;
  --accent:#8b9bff; --accent-strong:#6f7ff7; --accent-soft: rgba(139,155,255,.14);
  --mint:#34d8a8; --mint-soft: rgba(52,216,168,.13);
  --danger:#ff6b81; --danger-soft: rgba(255,107,129,.13);
  --warn:#ffb547; --warn-soft: rgba(255,181,71,.14);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -20px rgba(0,0,0,.6);
  --shadow-lg: 0 40px 100px -20px rgba(0,0,0,.75);
  --grid: rgba(255,255,255,.06);
  --input: rgba(255,255,255,.045);
  --blob1: rgba(111,127,247,.22); --blob2: rgba(52,216,168,.12); --blob3: rgba(192,132,252,.12);
}
html[data-theme="light"]{
  --bg:#f3f5fa; --bg2:#eef1f8;
  --card: rgba(255,255,255,.72); --card-solid:#ffffff; --card-hover: rgba(255,255,255,.92);
  --border: rgba(15,23,42,.07); --border-strong: rgba(15,23,42,.14);
  --text:#0d1326; --text2:#3a4358; --muted:#5d667b;
  --accent:#4c5ce6; --accent-strong:#3d4cd6; --accent-soft: rgba(76,92,230,.1);
  --mint:#067a59; --mint-soft: rgba(6,122,89,.1);
  --danger:#dc2650; --danger-soft: rgba(220,38,80,.09);
  --warn:#9a5800; --warn-soft: rgba(217,130,0,.12);
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 18px 40px -22px rgba(15,23,42,.22);
  --shadow-lg: 0 40px 90px -25px rgba(15,23,42,.35);
  --grid: rgba(15,23,42,.07);
  --input: rgba(15,23,42,.035);
  --blob1: rgba(99,115,245,.16); --blob2: rgba(20,184,140,.1); --blob3: rgba(192,132,252,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:14px;line-height:1.5;letter-spacing:-.005em;transition:background-color .5s var(--ease), color .3s var(--ease);overflow-x:hidden}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-fx i{position:absolute;border-radius:50%;filter:blur(90px);transition:background .6s}
.bg-fx i:nth-child(1){width:620px;height:620px;left:-140px;top:-220px;background:var(--blob1);animation:float1 22s ease-in-out infinite}
.bg-fx i:nth-child(2){width:520px;height:520px;right:-160px;top:20%;background:var(--blob2);animation:float2 26s ease-in-out infinite}
.bg-fx i:nth-child(3){width:480px;height:480px;left:35%;bottom:-260px;background:var(--blob3);animation:float1 30s ease-in-out infinite reverse}
.bg-fx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--grid) 1px, transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%);-webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%)}
@keyframes float1{50%{transform:translate(60px,40px) scale(1.08)}}
@keyframes float2{50%{transform:translate(-50px,60px) scale(1.05)}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:linear-gradient(180deg, var(--card), transparent);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8b9bff,#6f7ff7 45%,#34d8a8);box-shadow:0 8px 24px -6px rgba(111,127,247,.6), inset 0 1px 0 rgba(255,255,255,.35)}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:10px 12px 6px;font-weight:600}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text2);font-weight:500;position:relative;transition:background .25s var(--ease), color .25s, transform .2s var(--ease);text-align:left;width:100%}
.nav-btn:hover{background:var(--card-hover);color:var(--text)}
.nav-btn:active{transform:scale(.98)}
.nav-btn.active{background:var(--accent-soft);color:var(--text)}
.nav-btn.active::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-btn.active svg{color:var(--accent)}
.nav-btn .count{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--input);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-card{padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12.5px;color:var(--muted)}
.side-card strong{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.theme-switch{display:flex;padding:4px;border-radius:12px;background:var(--input);border:1px solid var(--border);position:relative}
.theme-switch button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.theme-switch button[aria-pressed="true"]{color:var(--text)}
.theme-switch .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:9px;background:var(--card-solid);box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .45s var(--ease)}
html[data-theme="light"] .theme-switch .pill{transform:translateX(100%)}
.ghost-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:500;transition:.2s}
.ghost-btn:hover{color:var(--text);background:var(--card-hover)}
main{padding:28px 36px 48px;min-width:0;max-width:1480px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.topbar h1{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13.5px;transition:transform .2s var(--ease), box-shadow .3s var(--ease), background .2s, opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 10px 28px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.22)}
html[data-theme="dark"] .btn-primary{background:linear-gradient(135deg,#6f7ff7,#5563e8)}
.btn-primary:hover{box-shadow:0 14px 34px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.22);transform:translateY(-1px)}
.btn-secondary{background:var(--input);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--card-hover);border-color:var(--border-strong)}
.btn-danger{color:#fff;background:linear-gradient(135deg,#f0506b,#d93355);box-shadow:0 10px 26px -12px #ff4d6d}
.kbd{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2);margin-left:2px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:.2s var(--ease)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.mobile-only{display:none!important}
.view{display:none}
.view.active{display:block;animation:viewIn .6s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);padding:22px;transition:border-color .3s, background .5s, transform .35s var(--ease), box-shadow .35s var(--ease);animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms);min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.link-btn{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:9px;transition:.2s;white-space:nowrap}
.link-btn:hover{background:var(--accent-soft)}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.kpi{overflow:hidden;padding:20px 20px 18px}
@media (hover:hover){.kpi:hover{transform:translateY(-3px);border-color:var(--border-strong)}}
.kpi-top{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;font-weight:500}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.kpi-val{font-size:27px;font-weight:700;letter-spacing:-.035em;margin:14px 0 8px;white-space:nowrap;position:relative;z-index:1}
.kpi-val .cur{font-size:15px;font-weight:600;color:var(--muted);margin-right:5px;letter-spacing:0}
.kpi-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip svg.i{width:13px;height:13px;stroke-width:2.2}
.chip.up{color:var(--mint);background:var(--mint-soft)}
.chip.down{color:var(--danger);background:var(--danger-soft)}
.chip.neutral{color:var(--text2);background:var(--input)}
.spark{position:absolute;right:0;bottom:0;width:42%;height:54px;opacity:.85;pointer-events:none}
.kpi.hero{background:linear-gradient(135deg, rgba(111,127,247,.28), rgba(52,216,168,.10) 70%), var(--card);border-color:rgba(139,155,255,.25)}
html[data-theme="light"] .kpi.hero{background:linear-gradient(135deg, rgba(76,92,230,.13), rgba(12,154,114,.06) 70%), var(--card)}
.seg-ctl{display:inline-flex;padding:3px;border-radius:10px;background:var(--input);border:1px solid var(--border)}
.seg-ctl button{padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:.25s var(--ease);white-space:nowrap}
.seg-ctl button[aria-pressed="true"]{background:var(--card-solid);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chart-wrap{position:relative;height:290px;margin:0 -6px}
.chart-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.axis-label{fill:var(--muted);font-size:11.5px;font-family:var(--font)}
.chart-line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart-area{opacity:0;transition:opacity 1.2s var(--ease) .35s}
.chart-area.in{opacity:1}
.hover-line{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:3 4;opacity:0;transition:opacity .2s}
.hover-dot{opacity:0;transition:opacity .2s}
.chart-tip{position:absolute;top:0;left:0;pointer-events:none;min-width:200px;padding:12px 14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:12.5px;opacity:0;transform:translateY(6px);transition:opacity .2s, transform .25s var(--ease);z-index:3}
.chart-tip.show{opacity:1;transform:none}
.chart-tip .t{font-weight:600;margin-bottom:8px}
.chart-tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--text2);padding:2px 0}
.chart-tip .r b{color:var(--text);font-weight:600}
.chart-tip .r i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:7px}
.chart-tip hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.donut-box{display:flex;flex-direction:column;align-items:center;gap:18px}
.donut{position:relative;width:200px;height:200px;flex-shrink:0}
.donut svg{width:100%;height:100%;overflow:visible}
.donut .seg{transition:stroke-dasharray 1.1s var(--ease), stroke-width .25s var(--ease), opacity .25s;cursor:pointer}
.donut .seg.dim{opacity:.3}
.donut .seg.hl{stroke-width:28}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-center .l{font-size:12px;color:var(--muted);font-weight:500}
.donut-center .v{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.donut-legend{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.donut-legend button{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);padding:5px 4px;border-radius:8px;text-align:left;transition:background .2s;min-width:0}
.donut-legend button span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-legend button:hover{background:var(--card-hover)}
.donut-legend i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.donut-legend .p{margin-left:auto;color:var(--muted);font-weight:500;white-space:nowrap;padding-left:4px}
.tx-row{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:14px;transition:background .2s, transform .35s var(--ease), opacity .35s;position:relative}
.tx-row:hover{background:var(--card-hover)}
.tx-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.tx-main{min-width:0;flex:1}
.tx-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:600;font-size:14px;white-space:nowrap;text-align:right}
.tx-amt.pos{color:var(--mint)}
.tx-del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:.2s;flex-shrink:0}
.tx-row:hover .tx-del,.tx-del:focus-visible{opacity:1}
.tx-del:hover{color:var(--danger);background:var(--danger-soft)}
.tx-row.removing{opacity:0;transform:translateX(30px)}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:18px 54px 6px 10px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.day-head:first-child{padding-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--input);outline:none;transition:border-color .2s, box-shadow .2s, background .2s;font-size:14px}
.search .input{padding-left:42px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;color:var(--text2);white-space:nowrap;transition:.2s var(--ease)}
.fchip:hover{border-color:var(--border-strong);color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.fchip i{width:7px;height:7px;border-radius:50%}
.tx-summary{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 10px 8px}
.tx-summary b{color:var(--text);font-weight:600}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .e-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.bar{height:8px;border-radius:999px;background:var(--input);overflow:hidden;position:relative}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;width:0;transition:width 1.2s var(--ease);overflow:hidden}
.bar>span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shine 2.4s ease-in-out 1.1s 1}
@keyframes shine{to{transform:translateX(100%)}}
.b-row{padding:11px 0}
.b-row+.b-row{border-top:1px solid var(--border)}
.b-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:13.5px}
.b-name{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.b-name .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.b-name .dot svg{width:15px;height:15px}
.b-amt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.b-amt b{color:var(--text);font-weight:600}
.budget-card .b-big{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:14px 0 2px}
.budget-card .b-of{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.budget-card .b-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.budget-card .b-foot b{font-weight:600;white-space:nowrap}
.budget-card .b-foot span{min-width:0}
.status-ok{color:var(--mint)}.status-warn{color:var(--warn)}.status-over{color:var(--danger)}
@media (hover:hover){.budget-card:hover,.goal-card:hover{transform:translateY(-3px);border-color:var(--border-strong)}}
.edit-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.2s}
.edit-btn:hover{color:var(--text);background:var(--card-hover)}
.summary-strip{display:flex;gap:36px;flex-wrap:wrap;align-items:center}
.summary-strip .s-item .l{font-size:12.5px;color:var(--muted)}
.summary-strip .s-item .v{font-size:22px;font-weight:700;letter-spacing:-.03em}
.ring{position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--input)}
html[data-theme="dark"] .ring .track{stroke:rgba(255,255,255,.07)}
html[data-theme="light"] .ring .track{stroke:rgba(15,23,42,.07)}
.ring .prog{transition:stroke-dashoffset 1.4s var(--ease)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:-.02em}
.goal-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.goal-mini .g{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:12px 6px;border-radius:16px;transition:background .2s}
.goal-mini .g:hover{background:var(--card-hover)}
.goal-mini .gn{font-size:13px;font-weight:600;line-height:1.3}
.goal-mini .gs{font-size:12px;color:var(--muted)}
.goal-card{display:flex;flex-direction:column;gap:18px}
.goal-top{display:flex;gap:18px;align-items:center}
.goal-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.goal-date{font-size:12.5px;color:var(--muted);margin-top:2px}
.goal-amt{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:8px}
.goal-amt span{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:0;display:block}
.goal-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-stats>div{padding:10px 12px;border-radius:12px;background:var(--input);border:1px solid var(--border)}
.goal-stats .l{font-size:11.5px;color:var(--muted)}
.goal-stats .v{font-size:13.5px;font-weight:600}
.goal-actions{display:flex;gap:8px}
.goal-actions .btn{flex:1;padding:10px}
.add-card{border:1.5px dashed var(--border-strong);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);min-height:280px;font-weight:600;box-shadow:none;backdrop-filter:none}
.add-card:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.add-card .plus{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.acc{display:flex;align-items:center;gap:14px;padding:11px 4px}
.acc+.acc{border-top:1px solid var(--border)}
.acc .tx-ico{width:38px;height:38px}
.acc-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 0;margin-top:4px;border-top:1px solid var(--border-strong);font-weight:600}
.acc-total .v{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;visibility:hidden;transition:visibility 0s .45s}
.modal-root.open{visibility:visible;transition:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,6,14,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .35s var(--ease)}
.modal-root.open .modal-backdrop{opacity:1}
.modal{position:relative;width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card-solid);border:1px solid var(--border-strong);border-radius:24px;box-shadow:var(--shadow-lg);padding:26px;opacity:0;transform:translateY(18px) scale(.97);transition:opacity .35s var(--ease), transform .45s var(--ease)}
.modal-root.open .modal{opacity:1;transform:none}
.modal h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.modal .m-sub{color:var(--muted);font-size:13px;margin-top:4px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label,.field .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:7px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-input{position:relative}
.amount-input span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--muted)}
.amount-input .input{padding-left:58px;font-size:24px;font-weight:700;letter-spacing:-.02em;padding-top:14px;padding-bottom:14px}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--input);border:1px solid var(--border);position:relative;margin-bottom:18px}
.type-toggle button{padding:10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);z-index:1;display:flex;gap:8px;align-items:center;justify-content:center;transition:color .3s}
.type-toggle button[aria-pressed="true"]{color:var(--text)}
.type-toggle .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--card-hover);border:1px solid var(--border-strong);transition:transform .45s var(--ease)}
.type-toggle.income .pill{transform:translateX(100%)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:13px;border:1px solid var(--border);background:var(--input);font-size:11.5px;font-weight:500;color:var(--text2);transition:.2s var(--ease);text-align:center;line-height:1.2}
.cat-opt:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.cat-opt[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--text)}
.cat-opt .ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.m-actions .btn{min-width:120px}
.err{color:var(--danger);font-size:12px;margin-top:6px}
.err:empty{display:none}
.input.invalid{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
.color-pick{display:flex;gap:10px}
.color-pick button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;transition:.2s;box-shadow:0 0 0 1px var(--border)}
.color-pick button[aria-pressed="true"]{border-color:var(--card-solid);box-shadow:0 0 0 2px var(--c)}
html[data-theme="dark"] input[type="date"]{color-scheme:dark}
html[data-theme="light"] input[type="date"]{color-scheme:light}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:14px;background:var(--card-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;animation:toastIn .5s var(--ease)}
.toast .t-ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint);flex-shrink:0}
.toast .t-ico svg{width:14px;height:14px;stroke-width:2.6}
.toast button{color:var(--accent);font-weight:600;padding:4px 8px;border-radius:8px}
.toast button:hover{background:var(--accent-soft)}
.toast.out{animation:toastOut .35s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.96)}}
.bottom-nav{display:none}
@media (max-width:1320px){
  .kpis>.card{grid-column:span 6}
  .span-8.chart-card,.span-4.donut-card{grid-column:span 12}
  .donut-box{flex-direction:row;align-items:center;gap:40px}
  .donut-legend{flex:1}
  .budgets-grid>.card{grid-column:span 4}
}
@media (max-width:1100px){
  .span-7,.span-5{grid-column:span 12}
  .budgets-grid>.card,.goals-grid>.card{grid-column:span 6}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  main{padding:18px 16px 112px}
  .mobile-only{display:grid!important}
  .desktop-only{display:none!important}
  .topbar{margin-bottom:18px;align-items:flex-start}
  .topbar h1{font-size:22px}
  .topbar .sub{font-size:12.5px}
  .grid{gap:12px}
  .grid[style*="margin-bottom:20px"]{margin-bottom:12px!important}
  .card{padding:18px;border-radius:18px}
  .kpi{padding:16px}
  .kpi-top{font-size:12px;gap:8px}
  .kpi-ico{width:30px;height:30px}
  .kpi-val{font-size:19px;margin:12px 0 6px}
  .kpi-val .cur{font-size:11.5px;margin-right:3px}
  .kpis>.card{grid-column:span 6}
  .kpis>.card.hero,.kpis>.card:last-child{grid-column:span 12}
  .kpis>.card.hero .kpi-val{font-size:32px}
  .kpis>.card.hero .kpi-val .cur{font-size:16px}
  .kpi-foot .hide-sm{display:none}
  .kpis>.card.hero .kpi-foot .hide-sm{display:inline}
  .spark{width:38%;height:40px}
  .kpis>.card.hero .spark{width:45%;height:64px}
  .chart-wrap{height:230px}
  .card-head{flex-wrap:wrap}
  .donut-box{flex-direction:column}
  .goal-mini{grid-template-columns:repeat(2,1fr)}
  .budgets-grid>.card,.goals-grid>.card{grid-column:span 12}
  .summary-strip{gap:18px 28px}
  .tx-del{opacity:.6}
  .tx-row{padding:10px 4px;gap:12px}
  .day-head{padding-right:48px;padding-left:4px}
  .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;padding:8px;border-radius:22px;border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);justify-content:space-around;align-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  html[data-theme="dark"] .bottom-nav{background:rgba(15,21,38,.88)}
  html[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.9)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:14px;transition:.2s;min-width:60px}
  .bottom-nav button.active{color:var(--accent);background:var(--accent-soft)}
  .bottom-nav .fab-in{width:48px;height:48px;border-radius:16px;min-width:48px;padding:0;justify-content:center;color:#fff;background:linear-gradient(135deg,#6f7ff7,#5563e8);box-shadow:0 10px 24px -8px var(--accent)}
  .bottom-nav .fab-in svg{width:22px;height:22px}
  .modal-root{place-items:end center;padding:0}
  .modal{border-radius:24px 24px 0 0;width:100%;max-height:92vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%)}
  .toasts{bottom:100px;width:calc(100% - 32px)}
}
@media (max-width:480px){
  .chart-card .legend{display:none}
}
/* ===== iOS / PWA ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,a,label,input,select,textarea,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
body.modal-open{overflow:hidden}
.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:calc(100dvh - 40px)}
.sb-bg{display:none}
@media (display-mode: standalone){
  html[data-theme="light"] .sb-bg{display:block;position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0d1326;z-index:45}
}
.sidebar{padding-top:calc(22px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left))}
main{padding-top:calc(28px + env(safe-area-inset-top));padding-right:calc(36px + env(safe-area-inset-right))}
@media (pointer:coarse){ .input{font-size:16px} }
input[type="date"].input{-webkit-appearance:none;appearance:none;min-height:46px;line-height:1.3;display:block;text-align:left;font-variant-numeric:tabular-nums}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:.65;cursor:pointer}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
@media (hover:none){
  .card:hover,.kpi:hover,.budget-card:hover,.goal-card:hover,.add-card:hover,.btn:hover,.icon-btn:hover,.g:hover,.nav-btn:hover{transform:none!important}
}
/* Lange Texte */
.goal-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}
.goal-mini .gn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.toast{max-width:min(560px,calc(100vw - 32px))}
.toast>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.toast.warn .t-ico{background:var(--warn-soft);color:var(--warn)}
.status-none{color:var(--muted)}
.goal-date.overdue{color:var(--warn);font-weight:600}
.tx-rcpt{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--accent);background:var(--accent-soft);transition:transform .2s var(--ease)}
.tx-rcpt:active{transform:scale(.92)}
.tx-rcpt svg{width:17px;height:17px}
.tx-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Sekundär-Button oben */
.btn-scan{background:var(--card);border:1px solid var(--border-strong);color:var(--text)}
.btn-scan svg{color:var(--accent)}
.icon-btn.accent{background:linear-gradient(135deg,#6f7ff7,#5563e8);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--accent)}
/* Install-Hinweis */
.install-hint{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--border-strong);background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--card)}
.install-hint .ih-ico{width:40px;height:40px;border-radius:12px;flex:none;background:url(apple-touch-icon.png) center/cover;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.install-hint .ih-t{font-weight:600;font-size:13.5px}
.install-hint .ih-s{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
.install-hint .ih-s svg{width:14px;height:14px;vertical-align:-2px;color:var(--accent)}
.install-hint .icon-btn{flex:none;width:34px;height:34px}
.m-reset{display:none;margin:22px auto 0;color:var(--muted);font-size:13px;font-weight:500;padding:10px 14px;border-radius:12px}
.m-reset svg{width:15px;height:15px;vertical-align:-3px;margin-right:6px}
@media (max-width:900px){ .m-reset{display:block} }
/* ===== Belegscanner ===== */
.scan-cta{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:18px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft);text-align:left;transition:transform .2s var(--ease),background .2s}
.scan-cta:active{transform:scale(.985)}
.scan-cta .sc-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,#8b9bff,#5563e8 60%,#34d8a8)}
.scan-cta .sc-ico svg{width:20px;height:20px}
.scan-cta b{display:block;font-size:14px}
.scan-cta small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.scan-cta .chev{margin-left:auto;color:var(--muted)}
.sheet-opts{display:grid;gap:10px;margin-top:4px}
.sheet-opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--input);text-align:left;transition:background .2s,transform .2s var(--ease)}
.sheet-opt:active{transform:scale(.985)}
.sheet-opt .so-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.sheet-opt b{display:block;font-size:14.5px}
.sheet-opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rc-top{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:stretch;margin:4px 0 18px}
.rc-thumb{position:relative;height:156px;border-radius:16px;overflow:hidden;background:#0b0f1c;border:1px solid var(--border-strong)}
.rc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rc-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,8,18,.45))}
.rc-scan{position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(52,216,168,.22));border-bottom:2px solid #34d8a8;box-shadow:0 6px 18px -2px rgba(52,216,168,.7);animation:rcScan 1.7s cubic-bezier(.45,0,.55,1) infinite alternate;z-index:1}
@keyframes rcScan{from{transform:translateY(-100%)}to{transform:translateY(240%)}}
.rc-thumb.done .rc-scan{display:none}
.rc-thumb .rc-badge{position:absolute;right:8px;bottom:8px;z-index:2;width:26px;height:26px;border-radius:50%;display:none;place-items:center;background:#34d8a8;color:#06281f;animation:pop .4s var(--ease)}
.rc-thumb.done .rc-badge{display:grid}
.rc-thumb .rc-badge svg{width:15px;height:15px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.rc-status{display:flex;flex-direction:column;justify-content:center;min-width:0}
.rc-status .st-t{font-weight:650;font-size:15px;letter-spacing:-.01em}
.rc-status .st-s{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
.rc-prog{height:6px;border-radius:99px;background:var(--input);overflow:hidden;margin:12px 0 10px}
.rc-prog>span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8b9bff,#34d8a8);transition:width .35s var(--ease)}
.rc-steps{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.rc-steps li{display:flex;align-items:center;gap:8px;list-style:none}
.rc-steps li i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;transition:.25s}
.rc-steps li.on{color:var(--text)}
.rc-steps li.on i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.rc-steps li.ok{color:var(--text2)}
.rc-steps li.ok i{border-color:#34d8a8;background:#34d8a8;animation:none}
.rc-steps li.ok i::after{content:"";width:6px;height:3px;border:solid #06281f;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-conf{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;width:max-content;max-width:100%}
.rc-conf.hoch{background:var(--mint-soft);color:var(--mint)}
.rc-conf.mittel{background:var(--accent-soft);color:var(--accent)}
.rc-conf.tief{background:var(--warn-soft);color:var(--warn)}
.rc-form{transition:opacity .35s var(--ease),filter .35s}
.rc-form.busy{opacity:.45;filter:saturate(.4);pointer-events:none}
.det{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 7px;border-radius:99px;background:var(--mint-soft);color:var(--mint);font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;vertical-align:1px}
.det svg{width:10px;height:10px;stroke-width:3.2}

/* Performance auf Mobilgeräten: keine animierten Blur-Ebenen hinter Glas-Karten */

/* Onboarding */
.onb{margin-bottom:20px;padding:26px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--mint) 10%,var(--card)))}

@media (hover:hover){.onb-steps li:not(.ok) button:hover{border-color:var(--accent);transform:translateY(-1px)}}

.os-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card-solid);border:1px solid var(--border-strong);color:var(--text2)}
.cur .os-n{background:var(--accent);border-color:var(--accent);color:#fff}
.ok .os-n{background:var(--mint);border-color:var(--mint);color:#06281d}
.os-t{flex:1;min-width:0}.os-t b{display:block;font-size:13.5px}.os-t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.big-empty{text-align:center;padding:44px 24px}

.big-empty h3{margin:0 0 8px;font-size:19px}

.cats-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

.cat-sec{margin-bottom:26px}

.cc-main{flex:1;min-width:0}
.cc-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-meta{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-amt{text-align:right;font-weight:600;font-size:13.5px;white-space:nowrap}.cc-amt small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.cat-card .icon-btn{flex:none;width:36px;height:36px}
.cat-prev{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--input);border:1px solid var(--border);margin-bottom:18px}
.cp-n{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-t{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.seg-wide{display:flex;width:100%}.seg-wide button{flex:1;padding:9px 10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.color-pick{flex-wrap:wrap}
.icon-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icon-pick button{aspect-ratio:1;min-height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--border);background:var(--input);color:var(--text2);transition:.15s}
.icon-pick button[aria-pressed="true"]{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:var(--input);cursor:pointer;margin-bottom:6px}
.check-row input,.radio-row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check-row b,.radio-row b{display:block;font-size:13.5px}.check-row small,.radio-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}
.radio-list{display:grid;gap:10px;margin-bottom:8px}
.radio-row{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--input);cursor:pointer}
.radio-row:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--input))}
.radio-row>span{flex:1;min-width:0}.radio-row select{margin-top:10px;width:100%}

.cat-new{border-style:dashed!important;color:var(--accent)!important}.cat-new .ci{background:var(--accent-soft);color:var(--accent)}

.inl-row{display:flex;gap:8px}.inl-row .input{flex:1;min-width:0}.inl-row .btn{flex:none}
.acc-pick{display:flex;flex-wrap:wrap;gap:8px}
.acc-pick .fchip{padding:9px 14px;font-size:13px}

.set-sec{margin-bottom:18px}
.set-list .acc{padding:11px 8px}

.wipe-warn{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--danger-soft);color:var(--text2);margin-bottom:16px;line-height:1.55;font-size:13.5px}
.wipe-warn .i{flex:none;color:var(--danger);margin-top:2px}.wipe-warn p{margin:0}
.set-foot{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 20px}
.more-tiles{display:none;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:18px}
.more-tile{display:flex;align-items:center;gap:12px;padding:16px;text-align:left}
.more-tile>span:nth-child(2){flex:1;min-width:0}.more-tile b{display:block;font-size:14.5px}.more-tile small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.ws-row{margin-top:14px}

<div class="sb-bg" aria-hidden="true"></div>

    [/kino|eintritt|ticketcorner|museum|konzert/i,'freizeit']];
  const STRONG=/(^|[^a-z])(total|tota1|totai|summe|gesamt(betrag|summe|total)?|zu\s*bezahlen|zu\s*zahlen|zahlbetrag|endbetrag|rechnungsbetrag|betrag\s*chf|montant|totale)([^a-z]|$)/i;
  const STRONG_BAD=/(mwst|mw\.?\s?st|tva|iva|ust|steuer)\s*(total|betrag|summe)|(total|summe)\s*(mwst|mw\.?\s?st|tva|iva|exkl|netto|ohne)|zwischen\s*(summe|total)|subtotal|sub\s?total|netto|rabatt|ersparnis|gespart|punkte|anzahl|artikel/i;
  const PAY=/(^|[^a-z])(karte|kartenzahlung|debit|maestro|visa|mastercard|master\s?card|v\s?pay|postfinance|post\s?card|twint|kreditkarte|ec[- ]?karte|apple\s?pay|google\s?pay|bezahlt|zahlung)([^a-z]|$)/i;
  const CASH=/(^|[^a-z])(bar|bargeld|cash|gegeben|erhalten)([^a-z]|$)/i;
  const CHANGE=/r[uü]ckgeld|retour|wechselgeld|zur[uü]ck/i;
  const NEG=/mwst|mw\.?\s?st|tva|iva|steuer|netto|exkl|rabatt|aktion|ersparnis|gespart|cumulus|supercard|punkte|bonus|r[uü]ckgeld|retour|wechselgeld|trinkgeld|zwischen|subtotal|%/i;
  const MONTHS={jan:1,feb:2,'mär':3,mar:3,maer:3,apr:4,mai:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
  const pad=n=>String(n).padStart(2,'0');

    const s=`${y}-${pad(m)}-${pad(d)}`;if(today){if(s>today)return null;const [ty]=today.split('-').map(Number);if(y<ty-10)return null}return s}
  function findDate(text,today){

    while((m=tx.exec(t))){const k=m[3].toLowerCase();const mo=MONTHS[k]||MONTHS[k.slice(0,3)];if(!mo)continue;const s=validDate(+m[4],mo,+m[2],today);if(s)return s}

  /* Beträge: 12.50 · 12,50 · 1'234.50 · 1’234,50 · 12.– · 12.- */
  function amountsIn(line){
    const out=[];const s=String(line);
    const re=/(\d{1,3}(?:['’`´]\d{3})+|\d+)\s?[.,]\s?(\d{2}|[-–—]{1,2})(?![\d])/g;let m;

      const after=s.slice(m.index+m[0].length);if(/^[.,]\d/.test(after)||/^\s?%/.test(after))continue;
      const int=+m[1].replace(/['’`´]/g,'');const dec=/\d/.test(m[2])?+m[2]:0;let v=int+dec/100;
      const neg=/-\s?$/.test(s.slice(Math.max(0,m.index-2),m.index));
      out.push({v:Math.round(v*100)/100,neg,i:m.index})}
    return out}
  const plausible=v=>v>=0.05&&v<=50000;
  function findTotal(lines){
    const L=lines.map(l=>l.trim());
    const strong=[],pay=[];let cash=null,change=null,otherMax=0;
    for(let i=0;i<L.length;i++){
      const l=L[i];let am=amountsIn(l).filter(a=>!a.neg);

        am=am.filter(a=>plausible(a.v));if(am.length)strong.push({v:am[am.length-1].v,i});continue}
      if(CHANGE.test(l)){if(am.length)change=am[am.length-1].v;continue}
      if(PAY.test(l)&&!NEG.test(l)){am=am.filter(a=>plausible(a.v));if(am.length)pay.push({v:am[am.length-1].v,i});continue}
      if(CASH.test(l)&&!NEG.test(l)){am=am.filter(a=>plausible(a.v));if(am.length)cash=am[am.length-1].v;continue}
      if(!NEG.test(l))for(const a of am)if(plausible(a.v)&&a.v>otherMax)otherMax=a.v;
    }
    const payOk=pay.filter(x=>x.v>=otherMax-0.001);

    if(payOk.length)return{total:Math.max(...payOk.map(x=>x.v)),source:'payment',confidence:'mittel'};
    if(cash!=null){const v=change!=null&&change<cash?Math.round((cash-change)*100)/100:cash;return{total:v,source:'cash',confidence:'mittel'}}
    let best=null;for(const l of L){if(NEG.test(l)||/\d{1,2}[.:]\d{2}\s*(uhr|h)\b/i.test(l))continue;for(const a of amountsIn(l))if(!a.neg&&plausible(a.v)&&(best==null||a.v>best))best=a.v}
    return best!=null?{total:best,source:'largest',confidence:'tief'}:{total:null,source:null,confidence:null}}
  const deO=s=>s.replace(/([a-z])0/gi,'$1o').replace(/0([a-z])/gi,'o$1').replace(/([a-z])1([a-z])/gi,'$1l$2');
  const BAD_HEAD=/quittung|beleg|kassenbon|kassenzettel|rechnung|receipt|willkommen|welcome|danke|merci|tel\.?|telefon|www\.|http|@|mwst|uid|che[-\s]?\d|filiale|kasse|bon\s?nr|datum|uhrzeit|^\W*$/i;
  function titleCase(s){if(s!==s.toUpperCase()||s.length<=4)return s;return s.toLowerCase().replace(/(^|[\s\-\/&(])([a-zäöüéèà])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Ag|Gmbh|Sa)\b/g,x=>x.toUpperCase().replace('GMBH','GmbH'))}
  function findMerchant(lines){
    const head=lines.slice(0,8).join('\n'),all=lines.join('\n');
    for(const src of [head,all]){const n=deO(src);for(const [re,name,cat] of M){if(re.test(n)&&name)return{name,cat,known:true}}}
    let cat=null;{const n=deO(all);for(const [re,name,c] of M)if(re.test(n)){cat=c;break}}
    for(const raw of lines.slice(0,6)){
      let l=raw.replace(/[|_~*=#<>{}\[\]]+/g,' ').replace(/\s{2,}/g,' ').trim().replace(/^[^A-Za-zÄÖÜäöü0-9]+|[^A-Za-zÄÖÜäöü0-9.&')]+$/g,'');
      if(l.length<3||BAD_HEAD.test(l))continue;
      const letters=(l.match(/[A-Za-zÄÖÜäöüéèà]/g)||[]).length;if(letters<3||letters/l.length<.55)continue;
      if(/^\d{4}\s+\D/.test(l)||/\b\d{4}\s+[A-ZÄÖÜ][a-zäöü]+$/.test(l)&&/\d/.test(l.slice(0,2)))continue;
      if(/(strasse|str\.|gasse|weg|platz|rue|via)\s*\d/i.test(l))continue;
      return{name:titleCase(l).slice(0,40),cat,known:false}}
    return{name:null,cat,known:false}}
  function categorize(text,merchant){if(merchant&&merchant.cat)return merchant.cat;for(const [re,c] of KW)if(re.test(text))return c;return null}
  function parse(text,today){
    const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
    const merchant=findMerchant(lines);const tot=findTotal(lines);const date=findDate(lines.join('\n'),today);

  return{parse,findDate,amountsIn,findTotal,findMerchant}
})();

const IDB={p:null,
  open(){if(this.p)return this.p;this.p=new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error('IndexedDB fehlt'));const r=indexedDB.open('vela-receipts',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});this.p.catch(()=>{this.p=null});return this.p},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('img',mode);const st=t.objectStore('img');let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error)})},
  put(k,v){return this.run('readwrite',s=>s.put(v,k))},get(k){return this.run('readonly',s=>s.get(k))},
  del(k){return this.run('readwrite',s=>s.delete(k)).catch(()=>{})},clear(){return this.run('readwrite',s=>s.clear()).catch(()=>{})},
  keys(){return this.run('readonly',s=>s.getAllKeys())}
};

function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>res({img,url});img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bild konnte nicht gelesen werden'))};img.src=url})}
function preprocess(img){
  const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height;
  let sc=Math.min(1,2000/Math.max(w0,h0));if(w0*sc<1000)sc=Math.min(1000/w0,2600/Math.max(w0,h0));
  const w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h),d=id.data,n=w*h,hist=new Uint32Array(256),g=new Uint8ClampedArray(n);
  for(let i=0,j=0;i<n;i++,j+=4){const v=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;g[i]=v;hist[v]++}
  let lo=0,hi=255,acc=0;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.02){lo=v;break}}acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>=n*.02){hi=v;break}}
  if(hi-lo<40){lo=Math.max(0,lo-20);hi=Math.min(255,hi+20)}const k=255/Math.max(1,hi-lo);
  const lut=new Uint8ClampedArray(256);for(let v=0;v<256;v++){const t=Math.min(1,Math.max(0,(v-lo)*k/255));lut[v]=Math.round(255*Math.pow(t,1.15))}
  for(let i=0,j=0;i<n;i++,j+=4){const v=lut[g[i]];d[j]=d[j+1]=d[j+2]=v;d[j+3]=255}
  x.putImageData(id,0,0);return c}
function makeThumb(img,max=720,q=.72){const w0=img.naturalWidth,h0=img.naturalHeight,sc=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

/* ===== Kategorie-Vorschläge (eigene Kategorien) ===== */
const fold=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[éèê]/g,'e').replace(/[àâ]/g,'a').replace(/[^a-z0-9]/g,'');
const mkey=d=>{const w=String(d||'').toLowerCase().split(/[\s,.;:\/\-]+/).map(fold).filter(x=>x.length>=2);return(w[0]||'').slice(0,30)};
const SYN={
  lebensmittel:['lebensmittel','essen','einkauf','einkaeufe','supermarkt','food','groceries','nahrung','haushalt','detailhandel','grundbedarf','esswaren'],
  restaurant:['restaurant','restaurants','auswaerts','gastro','gastronomie','ausgang','cafe','takeaway','beiz','lunch','mittagessen','essengehen','essen'],
  mobilitaet:['mobilitaet','verkehr','transport','oev','zug','bahn','auto','benzin','tanken','fahrten','velo','reisen'],
  gesundheit:['gesundheit','apotheke','medizin','arzt','krankenkasse','drogerie','pflege','koerperpflege'],
  shopping:['shopping','einkaufen','kleider','kleidung','elektronik','haushalt','anschaffungen','diverses','sonstiges','einkauf'],
  freizeit:['freizeit','hobby','hobbys','sport','kultur','unterhaltung','ausgang','ferien'],
  abos:['abos','abo','telekom','handy','internet','telefon','streaming','fixkosten']};
function matchCat(key,type='exp'){const list=SYN[key];if(!list)return '';let best='',bs=0;
  for(const c of catsFor(type)){const n=fold(c.label);if(!n)continue;list.forEach((syn,i)=>{let sc=0;if(n===syn)sc=100-i;else if(n.includes(syn)&&syn.length>=4)sc=60-i;else if(syn.includes(n)&&n.length>=4)sc=50-i;if(sc>bs){bs=sc;best=c.id}})}
  return best}
function suggestCat(desc,parserCat,type='exp'){
  const k=mkey(desc);const mem=k&&S.merchantCats[k];if(mem&&CATS[mem]&&catsFor(type).some(c=>c.id===mem))return{id:mem,src:'memory'};
  let pc=parserCat;if(!pc&&desc){try{pc=ReceiptParser.findMerchant([String(desc)]).cat}catch(e){}}
  const id=pc?matchCat(pc,type):'';return id?{id,src:'match'}:{id:'',src:null}}

let scanSeq=0;
async function startScan(file){
  if(!file)return;
  if(file.type&&!/^image\//.test(file.type)){toast('Bitte ein Bild (JPG, PNG, HEIC) wählen',null,'warn');return}
  const seq=++scanSeq;let loaded;
  try{loaded=await loadImage(file)}catch(e){toast('Das Bild konnte nicht geöffnet werden',null,'warn');return}
  const {img,url}=loaded;const st={type:'exp',cat:'',thumb:null,acc:defAcc()};const supported=OCR.supported();
  const steps=['Bild optimieren','Text erkennen','Angaben auswerten'];
  openModal(`${mHead('Beleg scannen','Die Erkennung läuft lokal auf Ihrem Gerät')}
    <div class="rc-top"><div class="rc-thumb" id="rcThumb"><img src="${url}" alt="Foto des Belegs"><div class="rc-scan"></div><span class="rc-badge">${ic('check')}</span></div>
      <div class="rc-status" aria-live="polite"><div class="st-t" id="rcT">${supported?'Bild wird optimiert …':'Bild übernommen'}</div><div class="st-s" id="rcS">${supported?'Einen Moment bitte':'Automatische Erkennung nicht verfügbar'}</div>
      <div class="rc-prog" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100"><span id="rcP"></span></div>
      <ul class="rc-steps" id="rcSteps">${steps.map((s,i)=>`<li data-i="${i}"><i></i>${s}</li>`).join('')}</ul></div></div>
    <div id="rcNote"></div>
    <form id="txForm" class="rc-form busy" novalidate><div id="rcFields">${txFormHTML({scan:true,noFocus:true,acc:st.acc})}</div>
    <details class="rc-raw" id="rcRaw" hidden><summary>Erkannten Text anzeigen</summary><pre id="rcRawT"></pre></details>
    ${actions('Speichern')}</form>`,m=>{
      m.dataset.scan=seq;
      const bind=()=>wireTxForm(m,st,async tx=>{if(!st.thumb)return;const key='r_'+tx.id;try{await IDB.put(key,st.thumb);tx.receipt=key}catch(e){toast('Beleg gespeichert, Bild konnte nicht abgelegt werden',null,'warn')}});
      bind();m._rebind=bind});
  const m=$('#modal'),alive=()=>$('#modalRoot').classList.contains('open')&&m.dataset.scan==String(seq);
  const setP=(p,t,s)=>{if(!alive())return;$('#rcP',m).style.width=Math.round(p)+'%';$('.rc-prog',m).setAttribute('aria-valuenow',Math.round(p));if(t)$('#rcT',m).textContent=t;if(s!=null)$('#rcS',m).textContent=s};
  const step=i=>{if(!alive())return;$$('#rcSteps li',m).forEach((li,j)=>{li.classList.toggle('ok',j<i);li.classList.toggle('on',j===i)})};
  const finish=(res,raw,note)=>{
    if(!alive())return;URL.revokeObjectURL(url);
    $('#rcThumb',m).classList.add('done');step(3);setP(100);
    const sg=res?suggestCat(res.merchant,res.category,'exp'):{id:'',src:null};st.cat=sg.id;
    const det={total:res&&res.total!=null,merchant:!!(res&&res.merchant),date:!!(res&&res.date),category:!!sg.id,catSrc:sg.src};
    const n=[det.total,det.merchant,det.date,det.category].filter(Boolean).length;
    $('#rcFields',m).innerHTML=txFormHTML({scan:true,noFocus:true,amount:res?res.total:null,desc:res?res.merchant:'',date:res&&res.date||TODAY,cat:st.cat,acc:st.acc},det);
    if(res&&!sg.id&&res.total!=null)note=note||(S.cats.length?'Kategorie bitte selbst wählen – Vela merkt sich Ihre Wahl für diesen Händler.':'Legen Sie unten direkt eine Kategorie an, z. B. «Essen». Vela merkt sich Ihre Wahl für diesen Händler.');
    if(note)$('#rcNote',m).innerHTML=`<div class="rc-note">${ic('info')}<span>${note}</span></div>`;
    if(raw&&raw.trim()){$('#rcRaw',m).hidden=false;$('#rcRawT',m).textContent=raw.trim()}
    const conf=res&&res.confidence;
    $('#rcT',m).textContent=n?`${n} von 4 Angaben erkannt`:'Bitte Angaben ergänzen';
    $('#rcS',m).innerHTML=n?'Bitte kurz prüfen und speichern.':'Der Beleg wurde als Bild übernommen.';
    $('.rc-prog',m).style.display='none';$('#rcSteps',m).style.display='none';
    if(conf)$('#rcS',m).insertAdjacentHTML('afterend',`<span class="rc-conf ${conf}">${ic('sparkle','width:12px;height:12px')}${conf==='hoch'?'Total sicher erkannt':conf==='mittel'?'Betrag aus Zahlungszeile':'Betrag geschätzt – bitte prüfen'}</span>`);
    $('#rcS',m).insertAdjacentHTML('afterend',`<button type="button" class="rc-retake" data-action="scan-photo">Anderes Foto wählen</button>`);
    $('#txForm',m).classList.remove('busy');m._rebind();
    const f=$('#fAmt',m);if(!det.total){f.focus({preventScroll:true})}
  };
  try{
    step(0);setP(4);await new Promise(r=>setTimeout(r,60));
    st.thumb=makeThumb(img);
    if(!supported){finish(null,'',location.protocol==='file:'?'Die automatische Erkennung braucht die installierte Web-App (Aufruf über https). Bitte Betrag und Details manuell ergänzen – das Foto wird trotzdem gespeichert.':'Ihr Browser unterstützt die Texterkennung nicht. Bitte Angaben manuell ergänzen.');return}

    let res=ReceiptParser.parse(raw,TODAY);
    if(res.total==null||res.confidence==='tief'||!res.merchant||!res.date){/* zweiter Durchgang: anderes Seitenlayout */
      setP(95,'Zweiter Durchgang …','Layout wird anders gelesen');
      try{const raw2=await OCR.recognize(canvas,()=>{},'4');if(!alive())return;const r2=ReceiptParser.parse(raw+'\n'+raw2,TODAY);
        const better=(r2.confidence==='hoch'&&res.confidence!=='hoch')||(res.total==null&&r2.total!=null);
        res={...res,merchant:res.merchant||r2.merchant,knownMerchant:res.knownMerchant||r2.knownMerchant,category:res.category||r2.category,date:res.date||r2.date,...(better?{total:r2.total,totalSource:r2.totalSource,confidence:r2.confidence}:{})};raw=raw+'\n\n'+raw2}catch(e){}}
    const none=res.total==null&&!res.merchant&&!res.date;
    finish(res,raw,none?'Auf dem Foto wurde kein lesbarer Text gefunden. Tipp: Beleg flach hinlegen, gut ausleuchten und formatfüllend fotografieren.':res.total==null?'Das Total wurde nicht gefunden. Bitte den Betrag ergänzen.':'');
  }catch(e){console.warn('OCR',e);finish(null,'','Die Texterkennung konnte nicht gestartet werden. Bitte Angaben manuell ergänzen.')}
}

    </div>
    <div class="card set-sec" style="--i:1"><div class="card-head"><div><div class="card-title">Konten</div><div class="card-sub">Startsaldo und Zuordnung Ihrer Buchungen</div></div><button class="btn btn-secondary btn-sm" data-action="newacc">${ic('plus','width:15px;height:15px')}Konto</button></div>
      ${S.accounts.length?`<div class="set-list">${S.accounts.map(a=>`<button class="acc" data-editacc="${esc(a.id)}"><div class="tx-ico" style="background:${a.color}1f;color:${a.color}">${ic(a.icon)}</div><div class="tx-main"><div class="tx-name">${esc(a.name)}</div><div class="tx-meta">${esc(a.bank||'Konto')} · Start ${chf(a.base)}</div></div><div class="tx-amt num">${chf(accBalance(a))}</div><span class="acc-edit">${ic('edit','width:15px;height:15px')}</span></button>`).join('')}<div class="acc-total"><span>Nettovermögen</span><span class="v num">${chf(netWorth())}</span></div></div>`:`<div class="soft-empty">Noch keine Konten. Fügen Sie z. B. Ihr Privat- und Sparkonto mit dem aktuellen Saldo hinzu.</div>`}</div>
    <div class="card set-sec" style="--i:2"><div class="card-head"><div><div class="card-title">Monatsbudget</div><div class="card-sub">Berechnung und Zeitraum Ihres Budgets</div></div></div>
      <div class="seg-ctl seg-wide" role="group" aria-label="Budget-Modus"><button data-bmode="balance" aria-pressed="${balMode()}">${ic('wallet','width:15px;height:15px')}Kontostand als Budget</button><button data-bmode="cats" aria-pressed="${!balMode()}">${ic('pie','width:15px;height:15px')}Summe der Kategorie-Budgets</button></div>
      <div class="ps-row"><label for="psSel">Budgetzeitraum beginnt am</label><select class="input" id="psSel" data-psel>${Array.from({length:28},(_,i)=>i+1).map(i=>`<option value="${i}"${S.periodStart===i?' selected':''}>${i}.${i===25?' (Taschengeld-Tag)':''}</option>`).join('')}<option value="last"${S.periodStart==='last'?' selected':''}>Letzter Tag des Monats</option></select></div>
      <label class="check-row ws-row"><input type="checkbox" id="wsChk" data-wshift${wShift()?' checked':''}><span><b>Am Wochenende auf Freitag vorziehen</b><small>Fällt der Zahltag auf einen Samstag oder Sonntag, beginnt der Zeitraum am Freitag davor</small></span></label>
      <p class="set-note ps-info">${ic('calendar','width:15px;height:15px')}<span>Aktueller Zeitraum: <b class="num">${curPeriod().labelY}</b> · noch ${daysTxt(daysLeftIn(curPeriod()))} ${untilTxt(curPeriod())}</span></p>
      <p class="set-note" style="margin:12px 0 0">${ic('info','width:15px;height:15px')}${balMode()?'Ihr Guthaben vor Beginn des Budgetzeitraums plus Einnahmen im Zeitraum (z. B. Taschengeld) ist Ihr Budget. Verfügbar = aktueller Kontostand. Limiten pro Kategorie bleiben optional.':'Das Gesamtbudget ist die Summe der Budgets, die Sie pro Kategorie festlegen.'}</p></div>
    <div class="card set-sec" style="--i:2"><div class="card-head"><div><div class="card-title">Darstellung</div><div class="card-sub">Hell oder dunkel</div></div></div>
      <div class="seg-ctl seg-wide" role="group" aria-label="Farbschema"><button data-theme-set="dark" aria-pressed="${th==='dark'}">${ic('moon','width:15px;height:15px')}Dunkel</button><button data-theme-set="light" aria-pressed="${th==='light'}">${ic('sun','width:15px;height:15px')}Hell</button></div></div>
    <div class="card set-sec" style="--i:3"><div class="card-head"><div><div class="card-title">Daten &amp; Sicherung</div><div class="card-sub">${grp(S.tx.length,0)} Buchungen · ${S.cats.length} Kategorien · ${S.accounts.length} Konten · ${S.goals.length} Sparziele</div></div></div>
      <p class="set-note">${ic('lock','width:15px;height:15px')}Alle Daten liegen nur auf diesem Gerät. Exportieren Sie regelmässig eine Sicherung – iOS kann Daten von selten genutzten Web-Apps entfernen.</p>
      <div class="set-actions"><button class="btn btn-secondary" data-action="export">${ic('download','width:16px;height:16px')}Sicherung exportieren</button><button class="btn btn-secondary" data-action="import">${ic('upload','width:16px;height:16px')}Sicherung importieren</button></div></div>
    <div class="card set-sec danger-zone" style="--i:4"><div class="card-head"><div><div class="card-title">Gefahrenzone</div><div class="card-sub">Nicht rückgängig zu machen</div></div></div>
      <div class="dz-row"><div><b>Alle Daten löschen</b><small>Entfernt Buchungen, Kategorien, Konten, Budgets, Sparziele und Belegfotos von diesem Gerät.</small></div><button class="btn btn-danger" data-action="wipe">${ic('trash','width:16px;height:16px')}Alle Daten löschen</button></div></div>
    <div class="set-foot">Vela · Version ${APP_VERSION} · Speicher-Schema ${SCHEMA}</div>`}
function openWipe(){
  openModal(`${mHead('Alle Daten löschen?')}<form id="wf" novalidate><div class="wipe-warn">${ic('trash')}<p>Damit werden <b>sämtliche</b> Buchungen (${grp(S.tx.length,0)}), Kategorien (${S.cats.length}), Konten (${S.accounts.length}), Budgets, Sparziele (${S.goals.length}) und Belegfotos endgültig von diesem Gerät entfernt.</p></div>
    <div class="field"><label for="wConf">Zur Bestätigung <b>LÖSCHEN</b> eingeben</label><input class="input" id="wConf" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="LÖSCHEN"><div class="err"></div></div>
    <div class="m-actions"><button type="button" class="btn btn-secondary" data-close autofocus>Abbrechen</button><button type="submit" class="btn btn-danger" id="wOk" disabled>${ic('trash','width:16px;height:16px')}Endgültig löschen</button></div></form>`,m=>{
    wireInputs(m);const ok=()=>$('#wConf',m).value.trim().toUpperCase()==='LÖSCHEN';$('#wConf',m).addEventListener('input',()=>{$('#wOk',m).disabled=!ok()});
    $('#wf',m).onsubmit=e=>{e.preventDefault();if(!ok())return invalid($('#wConf',m),'Bitte genau «LÖSCHEN» eingeben.');
      clearToasts();pendingImgDel.clear();IDB.clear();S=emptyData();syncCats();persist();try{localStorage.removeItem('vela.backup.v1')}catch(_){}F.q='';F.cat='all';F.type='all';F.limit=60;$('#txSearch').value='';$$('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type==='all')));closeModal();$('#kpis').dataset.built='';buildNav();go('dashboard');toast('Alle Daten wurden gelöscht')}})}
function exportData(){try{const blob=new Blob([JSON.stringify({app:'Vela',exported:new Date().toISOString(),...S},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`vela-sicherung-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Sicherung exportiert (ohne Belegfotos)')}catch(e){toast('Export nicht möglich',null,'warn')}}
async function importData(file){if(!file)return;try{if(file.size>20e6)throw new Error('gross');const o=JSON.parse(await file.text());if(!o||o.app!=='Vela')throw new Error('fremd');const d=sanitize({...o,userData:true});
  openConfirm('Sicherung importieren?',`Die Sicherung enthält ${grp(d.tx.length,0)} Buchungen, ${d.cats.length} Kategorien und ${d.accounts.length} Konten. Ihre aktuellen Daten auf diesem Gerät werden dadurch ersetzt.`,'Importieren',()=>{S=d;S.onboard=1;syncCats();persist();$('#kpis').dataset.built='';buildNav();renderView(current,true);toast('Sicherung importiert')})}
  catch(e){toast('Diese Datei ist keine gültige Vela-Sicherung',null,'warn')}}

function toast(msg,action,kind){const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.setAttribute('role','status');msg=String(msg);if(msg.length>140)msg=msg.slice(0,137)+'…';el.innerHTML=`<span class="t-ico">${ic(kind==='warn'?'info':'check')}</span><span>${esc(msg)}</span>${action?`<button type="button">${action.label}</button>`:''}`;$('#toasts').appendChild(el);{const live=$$('#toasts .toast:not(.out)');if(live.length>3)live[0]._kill(true)}let done=false;const kill=(silent)=>{if(done)return;done=true;clearTimeout(tm);if(!silent&&action&&!el._undone&&action.onExpire)action.onExpire();el.classList.add('out');setTimeout(()=>el.remove(),350)};el._kill=kill;if(action)el.querySelector('button').onclick=()=>{el._undone=true;action.fn();kill()};const tm=kind==='sticky'?0:setTimeout(kill,action?6000:kind==='warn'?5000:3200)}
function clearToasts(){$$('#toasts .toast').forEach(t=>{t._undone=true;t._kill&&t._kill(true)})}
function setTheme(t,save=true){if(t!=='dark'&&t!=='light')t='dark';document.documentElement.setAttribute('data-theme',t);$$('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));$('#mThemeBtn').innerHTML=ic(t==='dark'?'sun':'moon');$$('meta[name=theme-color]').forEach(mt=>mt.setAttribute('content',t==='dark'?'#070a13':'#f3f5fa'));if(save)try{localStorage.setItem(THEME_KEY,t)}catch(e){}}
let savedTheme=null;try{savedTheme=localStorage.getItem(THEME_KEY)}catch(e){}
const qTheme=new URLSearchParams(location.search).get('theme');
setTheme(qTheme||savedTheme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),!qTheme);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-receipt],[data-goto],[data-action],[data-close],[data-del],[data-editbudget],[data-deposit],[data-delgoal],[data-editcat],[data-delcat],[data-editacc],[data-quickcat],[data-bmode],[data-theme-set],[data-range],[data-cat],[data-type]');if(!t)return;
  if(t.dataset.receipt){e.stopPropagation();openReceipt(t.dataset.receipt,t.dataset.desc);return}
  if(t.hasAttribute('data-close')){closeModal();return}
  if(t.dataset.goto){go(t.dataset.goto);return}
  if(t.dataset.themeSet){setTheme(t.dataset.themeSet);if(current==='settings')renderSettings();return}
  if(t.dataset.bmode){S.budgetMode=t.dataset.bmode==='cats'?'cats':'balance';refresh();toast(S.budgetMode==='cats'?'Gesamtbudget = Summe der Kategorie-Budgets':'Gesamtbudget = Ihr Kontostand');return}
  if(t.dataset.editcat)return openCatModal(t.dataset.editcat);
  if(t.dataset.delcat)return openDelCat(t.dataset.delcat);
  if(t.dataset.editacc)return openAccModal(t.dataset.editacc);
  if(t.dataset.quickcat){const n=t.dataset.quickcat,ty=/lohn|gehalt|einnahm/i.test(n)?'inc':'exp';if(!findCatByName(n,ty)){const c=createCat(n,ty);toast(`Kategorie «${c.label}» angelegt`)}refresh();return}
  const a=t.dataset.action;
  if(a==='add')return innerWidth<=900?openScanSheet():openAddTx();
  if(a==='add-manual')return openAddTx();
  if(a==='scan-sheet')return openScanSheet();
  if(a==='scan-camera')return pickReceipt(true);
  if(a==='scan-photo')return pickReceipt(false);
  if(a==='hint-close'){try{localStorage.setItem('vela.hint','1')}catch(_){}$('#installHint').hidden=true;return}
  if(a==='theme')return setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  if(a==='newgoal')return openNewGoal();
  if(a==='newcat')return openCatModal(null,t.dataset.typePre);
  if(a==='onb-cat'){if(current!=='categories')go('categories');return openCatModal(null,'exp')}
  if(a==='newacc')return openAccModal();
  if(a==='onb-close'){S.onboard=1;refresh();return}
  if(a==='wipe')return openWipe();
  if(a==='export')return exportData();
  if(a==='import'){const i=$('#importInput');i.value='';i.click();return}
  if(t.dataset.range){range=+t.dataset.range;$$('[data-range]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));renderChart(true);return}
  if(t.dataset.cat){F.cat=t.dataset.cat;F.limit=60;renderChips();renderTx();return}
  if(t.dataset.type){F.type=t.dataset.type;F.limit=60;$$('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));renderTx();return}
  if(t.dataset.del){const id=t.dataset.del;const row=t.closest('.tx-row');const idx=S.tx.findIndex(x=>x.id===id);if(idx<0)return;const [rm]=S.tx.splice(idx,1);persist();if(rm.receipt)pendingImgDel.add(rm.receipt);row&&row.classList.add('removing');setTimeout(refresh,300);toast(`«${rm.desc}» gelöscht`,{label:'Rückgängig',fn:()=>{if(!S.tx.some(x=>x.id===rm.id))S.tx.push(rm);if(rm.receipt)pendingImgDel.delete(rm.receipt);refresh()},onExpire:()=>{if(rm.receipt){pendingImgDel.delete(rm.receipt);if(!S.tx.some(x=>x.receipt===rm.receipt))IDB.del(rm.receipt)}}});return}
  if(t.dataset.editbudget)return openBudget(t.dataset.editbudget);
  if(t.dataset.deposit)return openDeposit(t.dataset.deposit);
  if(t.dataset.delgoal){const g=S.goals.find(x=>x.id===t.dataset.delgoal);if(!g)return;return openConfirm('Sparziel löschen?',`Möchten Sie «${esc(g.name)}» wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.`,'Löschen',()=>{S.goals=S.goals.filter(x=>x!==g);refresh();toast('Sparziel gelöscht')})}
});
$('#moreBtn').addEventListener('click',()=>{F.limit+=60;renderTx()});
let st;$('#txSearch').addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>{F.q=e.target.value;F.limit=60;renderTx()},120)});
document.addEventListener('keydown',e=>{
  const open=$('#modalRoot').classList.contains('open');
  if(e.key==='Escape'&&open){closeModal();return}
  if(open&&e.key==='Tab'){const f=$$('#modal button,#modal input,#modal summary,#modal textarea,#modal select').filter(x=>x.offsetParent!==null&&!x.disabled);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}
  if(!open&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){if(e.key==='n'||e.key==='N'){e.preventDefault();openAddTx()}else if(e.key==='/'){e.preventDefault();go('transactions');setTimeout(()=>$('#txSearch').focus(),60)}}
});
let rt,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(innerWidth!==lastW){lastW=innerWidth;if(current==='dashboard')renderChart(false)}},150)});
addEventListener('storage',e=>{if(e.key===KEY){S=load();syncCats();buildNav();renderView(current,false)}});
$('#importInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';importData(f)});
['camInput','picInput'].forEach(id=>$('#'+id).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)startScan(f)}));
$('.modal-backdrop').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function dayCheck(){const old=TODAY;tick();if(old!==TODAY){$('#kpis').dataset.built='';setHeader();buildNav();renderView(current,false)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')dayCheck()});setInterval(dayCheck,60000);
document.addEventListener('change',e=>{const el=e.target;if(!el||!el.matches||!el.matches('[data-psel],[data-wshift]'))return;if(el.matches('[data-wshift]'))S.weekendShift=!!el.checked;else S.periodStart=normPS(el.value);$('#kpis').dataset.built='';refresh();setHeader();toast(`Budgetzeitraum: ${curPeriod().labelY}`)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==current&&VIEWS.find(v=>v.id===h))go(h)});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',ev=>{let sv=null;try{sv=localStorage.getItem(THEME_KEY)}catch(_){}if(!sv&&!qTheme)setTheme(ev.matches?'light':'dark',false)});
if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false,shown=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;
    const busy=$('#modalRoot').classList.contains('open');
    if(performance.now()<10000&&!busy){reloading=true;location.reload();return}
    if(shown)return;shown=true;toast('Neue Version verfügbar',{label:'Neu laden',fn:()=>{reloading=true;location.reload()}},'sticky')});
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});setInterval(check,30*60*1000);
  }).catch(err=>console.info('Service Worker nicht registriert',err))})}


buildNav();
const start=(location.hash||'').slice(1);
if(start&&start!=='dashboard'&&VIEWS.find(v=>v.id===start))go(start);
else{setHeader();renderView('dashboard',true)}
installHint();setTimeout(cleanupReceipts,1500);
LOAD_WARN.forEach(w=>setTimeout(()=>toast(w,null,'warn'),600));
})();
</script>
</body>
</html>
